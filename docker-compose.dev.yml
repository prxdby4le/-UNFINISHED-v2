services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: trashtalk-records:app-dev
    container_name: trashtalk-app-dev
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - trashtalk-vendor:/var/www/html/vendor
    networks:
      - trashtalk-network
    depends_on:
      - db
      - redis
    environment:
      - APP_KEY=${APP_KEY}
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-trashtalk}
      - DB_USERNAME=${DB_USERNAME:-trashtalk}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    command: sh -c "php artisan wayfinder:generate --with-form || true && php-fpm"
    labels:
      - "com.trashtalk.project=trashtalk-records"
      - "com.trashtalk.service=app"
      - "com.trashtalk.environment=development"
      - "com.docker.compose.project=trashtalk-records"

  nginx:
    image: nginx:alpine
    container_name: trashtalk-nginx-dev
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - trashtalk-network
    depends_on:
      - app
    labels:
      - "com.trashtalk.project=trashtalk-records"
      - "com.trashtalk.service=nginx"
      - "com.trashtalk.environment=development"
      - "com.docker.compose.project=trashtalk-records"

  db:
    image: postgres:16-alpine
    container_name: trashtalk-db-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${DB_DATABASE:-trashtalk}
      - POSTGRES_USER=${DB_USERNAME:-trashtalk}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - trashtalk-db-data:/var/lib/postgresql/data
    networks:
      - trashtalk-network
    labels:
      - "com.trashtalk.project=trashtalk-records"
      - "com.trashtalk.service=database"
      - "com.trashtalk.environment=development"
      - "com.docker.compose.project=trashtalk-records"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-trashtalk}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trashtalk-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - trashtalk-redis-data:/data
    networks:
      - trashtalk-network
    command: redis-server --appendonly yes
    labels:
      - "com.trashtalk.project=trashtalk-records"
      - "com.trashtalk.service=cache"
      - "com.trashtalk.environment=development"
      - "com.docker.compose.project=trashtalk-records"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  node:
    image: node:20-alpine
    container_name: trashtalk-node-dev
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - trashtalk-node-modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    networks:
      - trashtalk-network
    depends_on:
      app:
        condition: service_started
    environment:
      - NODE_ENV=development
      - WAYFINDER_GENERATE=false
    labels:
      - "com.trashtalk.project=trashtalk-records"
      - "com.trashtalk.service=frontend"
      - "com.trashtalk.environment=development"
      - "com.docker.compose.project=trashtalk-records"

volumes:
  trashtalk-db-data:
    name: trashtalk-db-data
    labels:
      - "com.trashtalk.project=trashtalk-records"
      - "com.trashtalk.type=database"
      - "com.docker.compose.project=trashtalk-records"
  trashtalk-redis-data:
    name: trashtalk-redis-data
    labels:
      - "com.trashtalk.project=trashtalk-records"
      - "com.trashtalk.type=cache"
      - "com.docker.compose.project=trashtalk-records"
  trashtalk-vendor:
    name: trashtalk-vendor
    labels:
      - "com.trashtalk.project=trashtalk-records"
      - "com.trashtalk.type=dependencies"
      - "com.docker.compose.project=trashtalk-records"
  trashtalk-node-modules:
    name: trashtalk-node-modules
    labels:
      - "com.trashtalk.project=trashtalk-records"
      - "com.trashtalk.type=dependencies"
      - "com.docker.compose.project=trashtalk-records"

networks:
  trashtalk-network:
    name: trashtalk-network
    driver: bridge
    labels:
      - "com.trashtalk.project=trashtalk-records"
      - "com.docker.compose.project=trashtalk-records"